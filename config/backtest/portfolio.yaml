# Portfolio Backtest Configuration
# 组合级回测 — 单账户多持仓 + Screener 入场 + 统一出场

portfolio_backtest:
  # 回测时间区间
  start_date: "2023-06-27"
  end_date: "2026-06-18"

  # 资金
  initial_capital: 1_000_000.0
  cash_buffer: 0.05              # 保留 5% 现金缓冲

  # 选股
  screener: "momentum_screener"  # 使用的筛选器名称
  screener_params: {}            # 覆盖筛选器参数 (可选)
  top_n_candidates: 50           # 每日考虑的候选股数量上限

  # 市场环境判断 (基于筛选器输出广度)
  market_regime:
    score_threshold: 0.3         # 最低分阈值
    bullish_threshold: 0.6       # 平均分 >= 0.6 → 最多持仓 3 支
    neutral_threshold: 0.4       # 平均分 >= 0.4 → 最多持仓 2 支
    # 否则 → 最多持仓 1 支

  # 统一出场规则
  exit_rules:
    trailing_stop:
      enabled: true
      drawdown_pct: 0.10         # 10% 移动止损
    time_stop:
      enabled: false             # 关闭时间止损
    hard_stop:
      enabled: true
      loss_pct: 0.08             # 8% 硬止损
    signal_decay:
      enabled: true
      rank_threshold: 15         # 跌出 top 15 才卖（保留核心持仓）

  # 交易成本 (A 股规则)
  fill_price: "next_open"
  commission_rate: 0.0003        # 万三
  stamp_duty_rate: 0.001         # 千一 (仅卖出)
  slippage: 0.001               # 千一
  min_commission: 5.0            # 最低 5 元
  lot_size: 100                  # 一手 100 股
  allow_t_plus_1: true           # T+1 制度

  # 输出
  output_dir: "data/results"
  output_prefix: "portfolio_backtest"

  # AI 增强筛选
  ai_filter:
    enabled: false                  # 启用 AI 二次过滤（需要 DEEPSEEK_API_KEY）
    use_local_analyzer: true        # 使用本地数据+DeepSeek（推荐，不需yfinance）
    max_candidates_per_day: 5       # 每天最多分析多少只候选股
    cache_dir: "data/cache/llm"     # LLM 决策缓存目录

  # 策略驱动 (可选 — 不配置则使用纯 Screener 模式)
  strategy: ""                    # 策略名，如 "turtle", "ma_cross"
  strategy_params: {}            # 策略参数覆盖 (留空使用 YAML 默认值)
  strategy_buy_window: 1         # BUY 信号匹配窗口 (±N 天)
