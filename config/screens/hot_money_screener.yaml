# 游资选股筛网 v3 — 趋势预过滤 + 动量区间 + 质量门槛
screen: hot_money_screener
params:
  max_picks: 5
  min_score: 0.10
  min_daily_amount: 50_000_000

  # 动量区间（排除弱势票和过度拉伸票）
  momentum_lookback: 60
  momentum_min: 0.05           # 60 日涨幅 >= 5%
  momentum_max: 0.50           # 60 日涨幅 <= 50%

  pullback_near_ma_pct: 0.03
  pullback_gain_min: 0.015
  pullback_vol_ratio: 1.5

  breakout_period: 10
  breakout_gain_min: 0.03
  breakout_vol_ratio: 1.5

  strength_gain_min: 0.03
  strength_vol_ratio: 2.0
