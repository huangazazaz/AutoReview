# 金叉 + 质量过滤 + 分批 + 止盈止损 策略参数（v4 最终版）
strategy: golden_filter
params:
  # ---- 均线 ----
  fast: 5
  slow: 20
  # ---- RSI 过滤 ----
  rsi_period: 14
  rsi_max_entry: 70       # 买入时 RSI 必须 < 70（非超买）
  # ---- 布林带过滤 ----
  bb_period: 20
  bb_std: 2.0
  # ---- 量能过滤 ----
  vol_period: 20           # 成交量必须 > 20日均量
  # ---- 止损 ----
  stop_loss: 0.05
  # ---- 分批买入 ----
  batch_entry: true
  batches: [0.6, 0.2, 0.2]
  batch_triggers: [0.0, 0.05, 0.1]
  # ---- 阶梯止盈 ----
  take_profit_levels:
    - [0.20, 0.2]          # +20% 卖 20%
    - [0.30, 0.2]          # +30% 卖 20%
    - [0.45, 0.2]          # +45% 卖 20%（剩余 40% 由死叉/止损清仓）
  # ---- 回撤规则 ----
  drawdown_rules:
    - [0.05, 0.2]          # -5%: 加仓 20%
    - [0.10, 0.2]          # -10%: 加仓 20%
    - [0.15, -1.0]         # -15%: 清仓
