# 游资超短线策略 v2 — 激进止盈 + 趋势保护
# 四道闸门出场。
strategy: hot_money
params:
  # 闸门1: 移动止盈 — 激进锁利
  trailing_activate: 0.05      # 启用移动止盈的最低涨幅
  trailing_drawdown: 0.02      # 启用后从最高点回撤幅度即卖出

  # 闸门2: 时间止损
  time_stop_days: 5            # 最大持仓天数（趋势票需要时间）
  time_stop_min_gain: 0.03     # N天内收益低于此值则离场

  # 闸门3: 硬止损
  stop_loss: 0.05

  # 闸门4: 趋势破坏
  trend_ma_fast: 20
  trend_ma_mid: 60
