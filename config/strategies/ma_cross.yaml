# 均线交叉策略参数（v4: 分批买入 + 阶梯止盈 + 回撤规则）
strategy: ma_cross
params:
  fast: 5
  slow: 20
  stop_loss: 0.05
  # ---- 回撤规则（从持仓期最高点回撤时触发）----
  # 每级: [回撤%, 力度]
  # 正数 = 加仓(现金比例), 负数 = 减仓(持仓比例), -1 = 清仓
  drawdown_rules:
    - [0.05, 0.2]
    - [0.10, 0.2]
    - [0.15, -1.0]
  # ---- 分批买入（可选）----
  batch_entry: true
  batches: [0.6, 0.2, 0.2]
  batch_triggers: [0.0, 0.05, 0.1]
  # ---- 阶梯止盈（严格按比例，不强制清仓）----
  take_profit_levels:
    - [0.20, 0.2] # 涨 20% 卖 20%
    - [0.30, 0.2] # 涨 30% 卖 20%
    - [0.40, 0.2] # 涨 40% 卖 20%
