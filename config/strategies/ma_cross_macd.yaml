# MA Cross + MACD 动量过滤策略参数
strategy: ma_cross_macd
params:
  fast: 5
  slow: 20
  # MACD 动量过滤
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  # 止损
  stop_loss: 0.05
  # 分批买入
  batch_entry: true
  batches: [0.6, 0.2, 0.2]
  batch_triggers: [0.0, 0.05, 0.1]
  # 阶梯止盈
  take_profit_levels:
    - [0.20, 0.2]
    - [0.30, 0.2]
    - [0.45, 0.2]
  # 回撤规则
  drawdown_rules:
    - [0.05, 0.2]
    - [0.10, 0.2]
    - [0.15, -1.0]
