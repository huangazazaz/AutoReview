# 金叉 + RSI 择时过滤策略（最终优化版）
# 
# 设计思路：
#   在 MA 金叉策略的基础上增加 RSI 择时过滤器，
#   只在 RSI 35-65 的"甜区"响应金叉信号，
#   过滤掉弱势金叉（RSI < 35）和追高金叉（RSI > 65）。
#
# 回测结果（随机组 450 只股票，2025-01-01 ~ 2026-06-18）：
#   vs ma_cross 基准:
#     - 正收益股票: 232 vs 223 (+4.0%)
#     - 严重亏损(>-20%): 28 vs 43 (-34.9%)
#     - 平均胜率: 33.5% vs 33.3%
#     - 平均回撤: -18.6% vs -20.0%
#     - 平均收益: +9.82% vs +10.30%
#
strategy: trend_ma_breakout
params:
  # ---- 均线 ----
  fast: 5
  slow: 20
  # ---- RSI 择时（核心过滤器）----
  rsi_period: 14
  rsi_low: 35             # RSI 下限（低于此值趋势太弱，金叉可靠性低）
  rsi_high: 65            # RSI 上限（高于此值追高风险大）
  # ---- 止损 ----
  stop_loss: 0.05
  # ---- 分批买入 ----
  batch_entry: true
  batches: [0.6, 0.2, 0.2]
  batch_triggers: [0.0, 0.05, 0.1]
  # ---- 阶梯止盈 ----
  take_profit_levels:
    - [0.20, 0.2]          # +20% 卖 20%
    - [0.30, 0.2]          # +30% 卖 20%
    - [0.40, 0.2]          # +40% 卖 20%
  # ---- 回撤规则 ----
  drawdown_rules:
    - [0.05, 0.2]          # -5%: 加仓 20%
    - [0.10, 0.2]          # -10%: 加仓 20%
    - [0.15, -1.0]         # -15%: 清仓
